name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo. Also limits what a
# pull request from a fork could do with the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      # Runs the full suite with coverage; fails below the thresholds in vite.config.ts
      # (85% global branches). Before 2026-11-04 CI ran plain tests, so coverage sat
      # below its own threshold unnoticed.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Format, lint (incl. the money-time guard) and typecheck: Vite+ runs Oxfmt and
      # Oxlint with type-aware rules. `vp lint` alone would skip formatting.
      - name: Check
        run: pnpm check

      - name: Docs check
        run: pnpm docs:check

      - name: shadscan gate
        run: npm run shadscan:gate

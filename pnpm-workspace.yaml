blockExoticSubdeps: true

# An install script that isn't approved in allowBuilds fails the install instead of being skipped.
strictDepBuilds: true
# Don't install versions published in the last 24 hours (minutes); most malicious releases are pulled within hours.
minimumReleaseAge: 1440
# Refuse a version published with weaker trust evidence (e.g. lost provenance) than earlier ones: the sign of a hijacked account.
trustPolicy: no-downgrade
# Maintenance releases on older version lines, published by their usual maintainers before
# those lines had provenance. pnpm reads the missing provenance as a downgrade; it isn't one.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  esbuild: true      # wrangler bundler (native binary)
  sharp: true        # next.js image optimisation
  unrs-resolver: true  # eslint-import-resolver-typescript (Rust native binary)
  workerd: true      # wrangler local runtime (native binary)

overrides:
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  # AUTH-004: dev-only transitive dep of vitest; GHSA-fx2h-pf6j-xcff /
  # GHSA-v6wh-96g9-6wx3 (both Windows-only, but pin regardless).
  vite: ">=8.0.16"
